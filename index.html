<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super Mario Bros. NES (1985) Web Edition</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🍄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --nes-bg: #101014;
      --nes-frame: #24242e;
      --nes-gold: #fcc000;
      --nes-red: #d82800;
      --nes-white: #fcfcfc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1b1c24 0%, #08080a 100%);
      color: var(--nes-white);
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 100vw;
      max-height: 100vh;
    }

    #screen-container {
      position: relative;
      background-color: #000;
      border: 6px solid #333344;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(80, 120, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#nes-canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #5c94fc;
      width: 768px;
      height: 720px;
      max-width: 96vw;
      max-height: 75vh;
      object-fit: contain;
    }

    /* CRT scanline filter */
    .crt-effect::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 20;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.85;
    }

    /* Controls header & footer */
    .header-bar {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 10px;
      color: #aaa;
    }

    .header-bar span.title-glow {
      color: var(--nes-gold);
      text-shadow: 0 0 8px rgba(252, 192, 0, 0.6);
      font-size: 11px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .toolbar button {
      background: #2b2b38;
      color: #e0e0e0;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      padding: 6px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .toolbar button:hover {
      background: #3e3e52;
      border-color: var(--nes-gold);
      color: #fff;
    }

    .toolbar button.active {
      border-color: #00e676;
      color: #00e676;
    }

    .key-hints {
      margin-top: 8px;
      font-size: 8px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    .key-hints kbd {
      display: inline-block;
      padding: 2px 5px;
      font-size: 8px;
      color: #fff;
      background-color: #333;
      border: 1px solid #555;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.2);
    }

    /* On-Screen Mobile Touch Controller */
    #touch-controls {
      display: none;
      width: 100vw;
      max-width: 600px;
      padding: 10px 20px;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
    }

    .touch-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 0.05s, background 0.05s;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(252, 192, 0, 0.5);
      transform: scale(0.92);
      border-color: var(--nes-gold);
    }

    /* Virtual D-Pad */
    .dpad-container {
      position: relative;
      width: 130px;
      height: 130px;
      pointer-events: auto;
    }

    .dpad-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      background: rgba(50, 50, 60, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ddd;
      font-size: 12px;
    }

    .dpad-btn.up { top: 0; left: 44px; border-radius: 6px 6px 0 0; }
    .dpad-btn.down { bottom: 0; left: 44px; border-radius: 0 0 6px 6px; }
    .dpad-btn.left { top: 44px; left: 0; border-radius: 6px 0 0 6px; }
    .dpad-btn.right { top: 44px; right: 0; border-radius: 0 6px 6px 0; }
    .dpad-center {
      position: absolute;
      top: 44px; left: 44px;
      width: 42px; height: 42px;
      background: rgba(40, 40, 50, 0.7);
    }

    /* Action Buttons (B & A) */
    .action-container {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      padding-bottom: 8px;
    }

    .action-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(216, 40, 0, 0.7);
      border: 3px solid rgba(255, 255, 255, 0.4);
      font-size: 14px;
    }
    .action-btn.btn-b {
      background: rgba(220, 40, 20, 0.8);
      margin-top: 20px;
    }
    .action-btn.btn-a {
      background: rgba(180, 20, 20, 0.85);
      margin-bottom: 15px;
    }

    @media (max-width: 850px) or (pointer: coarse) {
      #touch-controls {
        display: flex;
      }
      .key-hints {
        display: none;
      }
      canvas#nes-canvas {
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div class="header-bar">
      <span class="title-glow">★ SUPER MARIO BROS. ★</span>
      <span>NES 1985 ENGINE</span>
    </div>

    <div id="screen-container" class="crt-effect">
      <canvas id="nes-canvas" width="256" height="240"></canvas>
    </div>

    <div class="toolbar">
      <button id="btn-sound" class="active">🔊 SOUND ON</button>
      <button id="btn-crt" class="active">📺 CRT SCANLINES</button>
      <button id="btn-autopilot">🤖 AUTO PLAY: OFF</button>
      <button id="btn-fullscreen">⛶ FULLSCREEN</button>
      <button id="btn-reset">↺ RESET (1-1)</button>
    </div>

    <div class="key-hints">
      [조작] 이동: <kbd>◀</kbd> <kbd>▶</kbd> / <kbd>A</kbd> <kbd>D</kbd> ┃ 앉기/파이프: <kbd>▼</kbd> / <kbd>S</kbd> ┃ 점프(A): <kbd>Z</kbd> / <kbd>K</kbd> / <kbd>Space</kbd> ┃ 대시/공격(B): <kbd>X</kbd> / <kbd>J</kbd> ┃ 자동진행(Auto): <kbd>P</kbd> ┃ 선택(Select 1P/2P): <kbd>Shift</kbd> ┃ 시작/일시정지(Start): <kbd>Enter</kbd>
    </div>
  </div>

  <!-- Mobile Touch Controller -->
  <div id="touch-controls">
    <div class="dpad-container">
      <div class="dpad-btn up" data-key="ArrowUp">▲</div>
      <div class="dpad-btn left" data-key="ArrowLeft">◀</div>
      <div class="dpad-center"></div>
      <div class="dpad-btn right" data-key="ArrowRight">▶</div>
      <div class="dpad-btn down" data-key="ArrowDown">▼</div>
    </div>
    <div class="action-container">
      <div class="touch-btn action-btn btn-b" data-key="KeyX">B</div>
      <div class="touch-btn action-btn btn-a" data-key="KeyZ">A</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
